services:
  nginx:
    image: nginx:latest
    ports:
      - "8005:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static/:/var/www/daystat/static/

  app:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./static/:/var/www/daystat/static/
