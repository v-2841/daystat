{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{% static 'img/apple-touch-icon.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="{% static 'img/favicon-32x32.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="{% static 'img/favicon-16x16.png' %}">
    <link rel="manifest" href={% static 'img/site.webmanifest' %}>
    <link rel="mask-icon"
          href="{% static 'img/safari-pinned-tab.svg' %}"
          color="#fdc3f5">
    <link rel="shortcut icon" href={% static 'img/favicon.ico' %}>
    <meta name="msapplication-TileColor" content="#fdc3f5">
    <meta name="msapplication-config"
          content="{% static 'img/browserconfig.xml' %}">
    <meta name="theme-color" content="#fdc3f5">
    <title>
      {% block title %}
        Место для заголовка
      {% endblock title %}
    </title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    {% block extrahead %}
    {% endblock extrahead %}
  </head>
  <body class="d-flex flex-column vh-100">
    <header>
      {% include "includes/header.html" %}
    </header>
    <main class="container py-4">
      {% block content %}
        Место основного контента
      {% endblock content %}
      {% include "includes/cat.html" %}
    </main>
    <footer class="mt-auto">
      {% include "includes/footer.html" %}
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
  </body>
</html>
