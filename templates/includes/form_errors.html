{% if form.errors %}
    <div class="alert alert-error mb-3">
        {% for error in form.non_field_errors %}<p>{{ error|escape }}</p>{% endfor %}
        {% for field in form %}
            {% for error in field.errors %}<p>{{ field.label }}: {{ error|escape }}</p>{% endfor %}
        {% endfor %}
    </div>
{% endif %}
