{% extends "base.html" %}
{% load static %}
{% block title %}
    Вес и калории
{% endblock title %}
{% block extrahead %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
{% endblock extrahead %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center pb-3">
        <h1 class="mb-0">Вес и калории</h1>
        <button id="refreshChartButton"
                type="button"
                class="btn btn-outline-pink"
                aria-label="Обновить данные графика"
                title="Обновить данные графика">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-2 align-items-start">
        <div class="btn-group" role="group" aria-label="Выбор параметра">
            <input type="radio"
                   class="btn-check"
                   name="type"
                   id="weightButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="weightButton">Вес</label>
            <input type="radio"
                   class="btn-check"
                   name="type"
                   id="caloriesButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="caloriesButton">Калории</label>
        </div>
        <div class="btn-group" role="group" aria-label="Выбор периода">
            <input type="radio"
                   class="btn-check"
                   name="range"
                   id="weekButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="weekButton">Неделя</label>
            <input type="radio"
                   class="btn-check"
                   name="range"
                   id="monthButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="monthButton">Месяц</label>
            <input type="radio"
                   class="btn-check"
                   name="range"
                   id="6monthsButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="6monthsButton">6 месяцев</label>
            <input type="radio"
                   class="btn-check"
                   name="range"
                   id="yearButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="yearButton">Год</label>
            <input type="radio"
                   class="btn-check"
                   name="range"
                   id="5yearsButton"
                   autocomplete="off">
            <label class="btn btn-outline-pink d-flex align-items-center"
                   for="5yearsButton">5 лет</label>
        </div>
    </div>
    <div class="mt-2 chart-container">
        <canvas id="myChart"></canvas>
    </div>
    <script src="{% static 'js/chart.js' %}"></script>
{% endblock content %}
