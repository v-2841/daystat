{% extends "base.html" %}
{% load static %}
{% block title %}
    Календарь
{% endblock title %}
{% block extrahead %}
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
{% endblock extrahead %}
{% block content %}
    <div id="calendar"></div>
    <div class="card my-4 text-center">
        <div class="card-header">Прогноз начала следующего цикла</div>
        <div class="card-body">{{ next_period_date }}</div>
    </div>
    <script src="{% static 'js/calendar.js' %}"></script>
{% endblock content %}
