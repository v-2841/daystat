{% extends "base.html" %}
{% load static %}
{% block title %}
    Цикл и вес
{% endblock title %}
{% block extrahead %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
{% endblock extrahead %}
{% block content %}
    <div class="d-flex justify-content-between align-items-center pb-3">
        <h1 class="mb-0">Цикл и вес</h1>
        <button id="refreshCycleWeightChartButton"
                type="button"
                class="btn btn-outline-pink"
                aria-label="Обновить данные графика"
                title="Обновить данные графика">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>
    <div class="chart-container">
        <canvas id="cycleWeightChart"></canvas>
    </div>
    <script src="{% static 'js/cycle_weight_chart.js' %}"></script>
{% endblock content %}
